[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # Third-party deprecations this project cannot act on. Kept as a narrow
    # list rather than a blanket "error" filter, so an upstream release cannot
    # turn CI red without anything here changing.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
