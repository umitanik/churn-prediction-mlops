version: '3.8'

services:
  db:
    image: postgres:13
    container_name: churn_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 654321
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: churn_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:654321@db:5432/churn_db
    volumes:
      - ./models:/app/models 

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: churn_dashboard
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000

volumes:
  postgres_data: